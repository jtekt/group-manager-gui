apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-manager-front
  namespace: moreillon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-manager-front
  template:
    metadata:
      labels:
        app: group-manager-front
    spec:
      containers:
        - name: group-manager-front
          image: ${CONTAINER_IMAGE_TAGGED}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          env:
            - name: VITE_OIDC_AUTHORITY
              value: https://keycloak.jtektrnd.net/realms/jtekt
            - name: VITE_OIDC_CLIENT_ID
              value: public
            - name: VITE_LOGIN_URL
              value: https://employees-api.jtektrnd.net/v3/auth/login
            - name: VITE_IDENTIFICATION_URL
              value: https://employees-api.jtektrnd.net/v3/users/self
            - name: VITE_GROUP_MANAGER_API_URL
              value: https://groups-api.jtektrnd.net
            - name: VITE_APPS_URL
              value: https://apps.jtektrnd.net
          resources: {}
          envFrom:
            - secretRef:
                name: environment-variables

---
apiVersion: v1
kind: Service
metadata:
  name: group-manager-front
  namespace: moreillon
spec:
  ports:
    - port: 80
      nodePort: 31101
  selector:
    app: group-manager-front
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: group-manager-front-legacy
  namespace: moreillon
spec:
  ports:
    - port: 80
      nodePort: 31100
  selector:
    app: group-manager-front
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: group-manager-front
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Group Manager
    gethomepage.dev/icon: https://gitlab.jtektrnd.net/uploads/-/system/project/avatar/4316/account-multiple-custom.png
    gethomepage.dev/group: 業務アプリ
    gethomepage.dev/pod-selector: app=group-manager-front
spec:
  ingressClassName: jtektrnd-net
  rules:
    - host: groups.jtektrnd.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: group-manager-front
                port:
                  number: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: group-manager-front
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - groups.jtektrnd.net
  rules:
    - backendRefs:
        - name: group-manager-front
          port: 80
